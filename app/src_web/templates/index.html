<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>PoliMarket - Cliente Web (Flask)</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7ff;
            --surface: rgba(255,255,255,0.94);
            --surface-strong: #ffffff;
            --text: #14213d;
            --muted: #64748b;
            --primary: #3b82f6;
            --primary-strong: #2563eb;
            --secondary: #e2e8f0;
            --border: #dce4f2;
            --success: #15803d;
            --warning: #b45309;
            --danger: #b91c1c;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }
        body {
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }
        .app-shell { max-width: 1220px; margin: 0 auto; padding: 24px 20px 40px; }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 24px 28px;
            border-radius: 24px;
            background: linear-gradient(120deg, #0f172a 0%, #1d4ed8 45%, #3b82f6 100%);
            color: #fff;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }
        .eyebrow {
            display: inline-block;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.78em;
            margin: 0 0 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .hero h1, .hero h2, .hero h3 { margin: 0 0 6px; }
        .hero p { margin: 0; opacity: 0.92; max-width: 620px; }
        .hero-badge {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.22);
            padding: 10px 12px;
            border-radius: 14px;
            font-weight: 700;
            white-space: nowrap;
        }
        h2, h3 { margin: 0 0 8px; }
                .card {
                        border: 1px solid var(--border);
                        background: var(--surface);
                        padding: 18px;
                        margin-bottom: 16px;
                        border-radius: 18px;
                        box-shadow: var(--shadow);
                        backdrop-filter: blur(8px);
                        transition: transform 0.18s ease, box-shadow 0.18s ease;
                }

    <nav class="tab-menu">
        <button class="tab-button" data-tab="tab-rf1" type="button">RF1 · Autorizar vendedor</button>
        <button class="tab-button" data-tab="tab-rf2" type="button">RF2 · Crear pedido</button>
        <button class="tab-button" data-tab="tab-rf3" type="button">RF3 · Verificar stock</button>
        <button class="tab-button" data-tab="tab-rf4" type="button">RF4 · Recibir orden compra</button>
        <button class="tab-button" data-tab="tab-rf5" type="button">RF5 · Entregas</button>
        <button class="tab-button" data-tab="tab-consultas" type="button" id="btn-consultas">📋 Consultas</button>
    </nav>

    <!-- RF1 -->
    <section id="tab-rf1" class="tab-panel">
        <div class="card">
            <div class="card-title-row">
                <h2>RF1 — Autorizar vendedor de campo</h2>
                <span class="card-icon" aria-hidden="true">🛡️</span>
            </div>
            <p style="color:#555;font-size:.9em">Registra la autorización de RRHH para que un vendedor pueda operar.</p>
            <form method="post" action="{{ url_for('autorizar_vendedor') }}">
                <input type="hidden" name="active_tab" value="tab-rf1">
                <label>Vendedor a autorizar</label>
                <select name="vendedor_id" required>
                    <option value="">— Seleccione vendedor —</option>
                    {% for v in vendedores %}
                    <option value="{{ v.id }}">{{ v.nombre }} · {{ v.codigo_vendedor }} · Zona {{ v.zona }}
                        {% if v.autorizado == 1 %} ✔ ya autorizado{% endif %}
                    </option>
                    {% endfor %}
                </select>
                <label>Autorizado por (empleado RRHH)</label>
                <select name="autorizado_por" required>
                    <option value="">— Seleccione empleado RRHH —</option>
                    {% for e in empleados_rrhh %}
                    <option value="{{ e.id }}">{{ e.nombre }} · {{ e.cargo }}</option>
                    {% endfor %}
                </select>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Autorizar vendedor</button>
                </div>
            </form>
        </div>
    </section>

    <!-- RF2 -->
    <section id="tab-rf2" class="tab-panel">
        <div class="card">
            <div class="card-title-row">
                <h2>RF2 — Crear y confirmar pedido</h2>
                <span class="card-icon" aria-hidden="true">🛒</span>
            </div>
            <p style="color:#555;font-size:.9em">Al confirmar, el stock se reduce automáticamente y se generan órdenes de compra si hay productos por debajo del mínimo.</p>
            <form method="post" action="{{ url_for('crear_pedido') }}" id="rf2-form">
                <input type="hidden" name="active_tab" value="tab-rf2">
                <div class="split">
                    <div>
                        <label>Cliente</label>
                        <select name="cliente_id" required>
                            <option value="">— Seleccione cliente —</option>
                            {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label>Vendedor</label>
                        <select name="vendedor_id" required>
                            <option value="">— Seleccione vendedor —</option>
                            {% for v in vendedores %}
                            <option value="{{ v.id }}">{{ v.nombre }}
                                {% if v.autorizado != 1 %} ⚠ sin autorizar{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <label>Productos del pedido</label>
                <div id="rf2-items">
                    <div class="item-row">
                        <select name="item_producto" required>
                            {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }} · ${{ "%.2f"|format(p.precio) }} · Stock: {{ stock_actual.get(p.id, 0) }}</option>
                            {% endfor %}
                        </select>
                        <input name="item_cantidad" type="number" min="1" value="1" required placeholder="Cant.">
                        <button type="button" class="btn btn-danger-sm" onclick="removeRow(this)">✕</button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="addProductRow()">+ Agregar producto</button>
                    <button type="submit" class="btn btn-primary">Crear pedido</button>
                </div>
            </form>
        </div>
    </section>

    <!-- RF3 -->
    <section id="tab-rf3" class="tab-panel">
        <div class="card">
            <div class="card-title-row">
                <h2>RF3 — Verificar disponibilidad de stock</h2>
                <span class="card-icon" aria-hidden="true">📦</span>
            </div>
            <p style="color:#555;font-size:.9em">Consulta si hay suficiente stock. Si el stock está bajo el mínimo, se genera una orden de compra automáticamente.</p>
            <form method="post" action="{{ url_for('verificar_stock') }}">
                <input type="hidden" name="active_tab" value="tab-rf3">
                <label>Producto</label>
                <select name="producto_id" required>
                    <option value="">— Seleccione producto —</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}">{{ p.nombre }} · Stock actual: {{ stock_actual.get(p.id, 0) }}</option>
                    {% endfor %}
                </select>
                <label>Cantidad a verificar</label>
                <input name="cantidad" type="number" min="1" value="1" required>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Verificar disponibilidad</button>
                </div>
            </form>
        </div>
    </section>

    <!-- RF4 -->
    <section id="tab-rf4" class="tab-panel">
        <div class="card">
            <div class="card-title-row">
                <h2>RF4 — Recibir orden de compra</h2>
                <span class="card-icon" aria-hidden="true">📥</span>
            </div>
            <p style="color:#555;font-size:.9em">Confirma la recepción de una orden de compra pendiente y repone el stock.</p>
            <form method="post" action="{{ url_for('recibir_orden') }}">
                <input type="hidden" name="active_tab" value="tab-rf4">
                <label>Orden de compra pendiente</label>
                <select name="orden_id" required>
                    <option value="">— Seleccione orden —</option>
                    {% for o in ordenes_pendientes %}
                    <option value="{{ o.id }}">#{{ o.id }} · {{ o.proveedor }} · ${{ "%.2f"|format(o.total) }} · {{ o.fecha[:10] }}</option>
                    {% endfor %}
                </select>
                {% if not ordenes_pendientes %}
                <p style="color:#888;font-size:.9em;margin-top:8px">No hay órdenes de compra pendientes.</p>
                {% endif %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" {% if not ordenes_pendientes %}disabled{% endif %}>Recibir orden</button>
                </div>
            </form>
        </div>
    </section>

    <!-- RF5 -->
    <section id="tab-rf5" class="tab-panel">
        <div class="split">
            <div class="card">
                <div class="card-title-row">
                    <h2>RF5 — Programar entrega</h2>
                    <span class="card-icon" aria-hidden="true">🚚</span>
                </div>
                <p style="color:#555;font-size:.9em">Asigna un repartidor y fecha a un pedido confirmado.</p>
                <form method="post" action="{{ url_for('programar_entrega') }}">
                    <input type="hidden" name="active_tab" value="tab-rf5">
                    <label>Pedido confirmado</label>
                    <select name="pedido_id" required>
                        <option value="">— Seleccione pedido —</option>
                        {% for p in pedidos_confirmados %}
                        <option value="{{ p.id }}">#{{ p.id }} · {{ p.cliente }} · ${{ "%.2f"|format(p.total) }}</option>
                        {% endfor %}
                    </select>
                    {% if not pedidos_confirmados %}
                    <p style="color:#888;font-size:.9em;margin-top:8px">No hay pedidos confirmados.</p>
                    {% endif %}
                    <label>Repartidor</label>
                    <select name="repartidor_id" required>
                        <option value="">— Seleccione repartidor —</option>
                        {% for r in repartidores %}
                        <option value="{{ r.id }}">{{ r.nombre }}</option>
                        {% endfor %}
                    </select>
                    <label>Fecha programada</label>
                    <input name="fecha_programada" type="date" required>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" {% if not pedidos_confirmados %}disabled{% endif %}>Programar entrega</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-title-row">
                    <h2>RF5 — Confirmar entrega</h2>
                    <span class="card-icon" aria-hidden="true">✅</span>
                </div>
                <p style="color:#555;font-size:.9em">Registra que el cliente recibió el pedido.</p>
                <form method="post" action="{{ url_for('confirmar_entrega') }}">
                    <input type="hidden" name="active_tab" value="tab-rf5">
                    <label>Entrega pendiente</label>
                    <select name="entrega_id" required>
                        <option value="">— Seleccione entrega —</option>
                        {% for e in entregas_pendientes %}
                        <option value="{{ e.id }}">#{{ e.id }} · Pedido #{{ e.pedido_id }} · {{ e.fecha_programada }}</option>
                        {% endfor %}
                    </select>
                    {% if not entregas_pendientes %}
                    <p style="color:#888;font-size:.9em;margin-top:8px">No hay entregas pendientes.</p>
                    {% endif %}
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" {% if not entregas_pendientes %}disabled{% endif %}>Confirmar entrega</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include '_consultas.html' %}

    <script>
        // ── Tab management ──────────────────────────────────────────
        const buttons = document.querySelectorAll(".tab-button:not(#btn-consultas)");

        function activateTab(tabId) {
            buttons.forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
            document.getElementById("btn-consultas").classList.toggle("active", tabId === "tab-consultas");
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === tabId));
            // If opening RF1, always refresh vendedor selects to ensure latest DB state
            if (tabId === 'tab-rf1') {
                fetch('/_partial/rf1_vendedores').then(r => r.text()).then(optionsHtml => {
                    document.querySelectorAll('select[name="vendedor_id"]').forEach(sel => sel.innerHTML = optionsHtml);
                }).catch(err => console.error('refresh vendedores error', err));
            }
        }

        buttons.forEach(b => b.addEventListener("click", () => activateTab(b.dataset.tab)));

        // Consultas tab: full page reload to get fresh data
        document.getElementById("btn-consultas").addEventListener("click", () => {
            window.location.href = "/?tab=tab-consultas";
        });

        // Activate the tab from the URL param (preserved after form submit)
        const activeTab = new URLSearchParams(window.location.search).get("tab") || "tab-rf1";
        activateTab(activeTab);

        // ── Toast notifications ───────────────────────────────────
        document.querySelectorAll(".toast").forEach((toast, index) => {
            setTimeout(() => toast.classList.add("hide"), 4000 + index * 200);
            setTimeout(() => toast.remove(), 4200 + index * 200);
        });

        // ── Server-Sent Events for live updates ─────────────────────
        if (window.EventSource) {
            try {
                const es = new EventSource('/events');
                es.onmessage = (e) => {
                    try {
                        const payload = JSON.parse(e.data);
                                if (payload.type === 'data-changed') {
                                    fetch('/_partial/consultas').then(r => r.text()).then(html => {
                                        const temp = document.createElement('div');
                                        temp.innerHTML = html;
                                        const newSection = temp.querySelector('#tab-consultas');
                                        const old = document.querySelector('#tab-consultas');
                                        if (old && newSection) old.replaceWith(newSection);
                                    }).catch(err => console.error('partial fetch error', err));
                                }
                                if (payload.type === 'vendedores-changed') {
                                    // refresh all vendedor selects in the page
                                    fetch('/_partial/rf1_vendedores').then(r => r.text()).then(optionsHtml => {
                                        document.querySelectorAll('select[name="vendedor_id"]').forEach(sel => {
                                            sel.innerHTML = optionsHtml;
                                        });
                                    }).catch(err => console.error('vendedores partial fetch error', err));
                                }
                    } catch (err) { console.error('sse parse error', err); }
                };
            } catch (err) { console.warn('EventSource not available', err); }
        }

        // ── RF2 dynamic product rows ────────────────────────────────
        const productOptions = `{% for p in productos %}<option value="{{ p.id }}">{{ p.nombre }} · ${{ "%.2f"|format(p.precio) }} · Stock: {{ stock_actual.get(p.id, 0) }}</option>{% endfor %}`;

        function buildItemRow() {
            const row = document.createElement("div");
            row.className = "item-row";
            row.innerHTML = `
                <select name="item_producto" required>${productOptions}</select>
                <input name="item_cantidad" type="number" min="1" value="1" required placeholder="Cant.">
                <button type="button" class="btn btn-danger-sm" onclick="removeRow(this)">✕</button>
            `;
            return row;
        }

        function addProductRow() {
            document.getElementById("rf2-items").appendChild(buildItemRow());
        }

        function removeRow(btn) {
            const container = document.getElementById("rf2-items");
            if (container.children.length > 1) {
                btn.closest(".item-row").remove();
            }
        }
    </script>
</body>
</html>
